name: Update Rainfall Data

on:
  schedule:
    - cron: '0 * * * *' # รันทุกต้นชั่วโมง
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add rainfall_24h.geojson
          git commit -m "Update rainfall data" || echo "No changes to commit"
          git push
